<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f35"><meta name="description" content="Tu espacio personal de alimentación y seguimiento nutricional">
<title>Entiende tu cuerpo</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#20332d;--muted:#718078;--green:#245b49;--line:#e3e9e3;--soft:#eaf1ec;--red:#a54438}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#173f35;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:2}header h1{font-size:21px;margin:0 0 4px}header p{margin:0;color:#d0e0d6;font-size:13px}.wrap{max-width:850px;margin:auto;padding:16px 14px 100px}.tabs{display:flex;gap:7px;overflow:auto;padding:0 0 12px;position:sticky;top:80px;background:var(--bg);z-index:1}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--ink);padding:10px 13px;border-radius:22px;font-weight:600}.tabs button.active{background:var(--green);color:white;border-color:var(--green)}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:0 0 13px;box-shadow:0 2px 10px #183c2c08}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:30px;font-weight:750;letter-spacing:-1px}.bar{height:9px;background:#e8eee9;border-radius:10px;overflow:hidden;margin:9px 0}.bar span{display:block;height:100%;background:#4d8b69;border-radius:10px}button,.btn{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;background:var(--green);color:white;font-weight:650;font-size:14px}.btn.secondary,button.secondary{background:var(--soft);color:var(--green)}button.danger{background:#f8e9e6;color:var(--red)}input,select{width:100%;border:1px solid #d9e1da;border-radius:10px;padding:11px;background:white;color:var(--ink);font:inherit;min-width:0}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field{flex:1;min-width:115px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.metric{flex:1;min-width:110px;background:#f6f8f5;border-radius:13px;padding:12px}.metric b{display:block;font-size:20px}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.tag{font-size:11px;padding:4px 8px;border-radius:20px;background:var(--soft);color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hidden{display:none!important}.notice{background:#fff7e8;border:1px solid #f0dfb8;padding:11px;border-radius:12px;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}.progress{font-size:13px;color:var(--muted)}.foodline{display:grid;grid-template-columns:1fr 78px 60px;gap:7px;align-items:end}.foodline select{padding:9px}.foodline input{padding:9px}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.wrap{padding-left:11px;padding-right:11px}.metric b{font-size:18px}}
</style></head>
<body><header><h1>Entiende tu cuerpo</h1><p>Alimentación, hábitos y seguimiento sin complicaciones</p></header>
<div class="wrap"><div class="tabs" id="tabs"></div><main id="app"></main></div>
<script>
const KEY='entiendeTuCuerpo_v1';
const initialFoods=[
['Pechuga de pollo',110,23,0,1.5,0],['Huevo',143,13,1.1,9.5,0],['Pan',265,9,49,3.2,2.7],['Cebolla',40,1.1,9.3,.1,1.7],['Tomate cherry',18,.9,3.9,.2,1.2],['Aguacate',160,2,8.5,14.7,6.7],['Pimiento rojo',31,1,6,.3,2.1],['Zanahoria',41,.9,9.6,.2,2.8],['Aceite de oliva',884,0,0,100,0],['Tomate frito',75,1.5,8,4,1.5],['Manzana',52,.3,14,.2,2.4],['Plátano',89,1.1,22.8,.3,2.6],['Yogur natural',61,3.5,4.7,3.3,0],['Leche semidesnatada',46,3.2,4.8,1.6,0],['Avena',389,16.9,66.3,6.9,10.6],['Almendras',579,21.2,21.6,49.9,12.5],['Patata',77,2,17.5,.1,2.2],['Pasta seca',371,13,74,1.5,3.2],['Queso Gouda',356,25,2.2,27,0],['Pavo en lonchas',105,18,2,2,0]
].map((x,i)=>({id:'f'+i,name:x[0],kcal:x[1],p:x[2],c:x[3],g:x[4],fiber:x[5]}));
const seed={
goal:1900,foods:initialFoods,pantry:[],meals:[],history:[
{date:'2026-11-09',entries:[{name:'Huevos cocidos (2 unidades)',grams:null,kcal:155,p:null,c:null,g:null,fiber:null,meal:'Desayuno'},{name:'Pollo 220 g, tomate cherry 88 g, aguacate 160 g, 2 sprays de aceite y pan 36 g',grams:null,kcal:609,p:null,c:null,g:null,fiber:null,meal:'Comida'}],total:764,partial:true},
{date:'2026-11-11',entries:[{name:'Pan 42 g, Gouda 29 g, pavo en lonchas 35 g y café solo',grams:null,kcal:242,p:17,c:null,g:null,fiber:null,meal:'Desayuno'},{name:'Pollo 250 g, 1 huevo, pimiento 139 g, 2 sprays de aceite y pan 32 g',grams:null,kcal:476,p:null,c:null,g:null,fiber:null,meal:'Comida'}],total:718,partial:true}
]};
let db=load(),tab='Resumen',draft=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{profiles:{Principal:structuredClone(seed)},active:'Principal'}}catch(e){return{profiles:{Principal:structuredClone(seed)},active:'Principal'}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function state(){return db.profiles[db.active]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(n){return n==null?'—':Math.round(n*10)/10}
function dayEntries(date){return state().meals.filter(x=>x.date===date)}
function totalFor(date){return dayEntries(date).reduce((a,x)=>a+x.kcal,0)}
function macrosFor(date){return ['p','c','g','fiber'].map(k=>{let a=dayEntries(date);return a.length&&a.every(x=>x[k]!=null)?a.reduce((s,x)=>s+x[k],0):null})}
const tabs=['Resumen','Comidas','Alimentos','Despensa','Recetas','Datos'];
function nav(){document.getElementById('tabs').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="go(\''+t+'\')">'+t+'</button>').join('')}
function go(t){tab=t;render()}
function render(){nav();let a=document.getElementById('app');a.innerHTML=({Resumen:home,Comidas:meals,Alimentos:foods,Despensa:pantry,Recetas:recipes,Datos:data}[tab])()}
function home(){let d=today(),n=totalFor(d),m=macrosFor(d),goal=state().goal,remaining=goal-n;return '<section class="card"><div class="row between"><div><div class="muted small">HOY · '+d+'</div><div class="big">'+fmt(n)+' <span class="muted" style="font-size:16px">kcal</span></div><div class="muted small">Objetivo: '+goal+' kcal</div></div><div style="text-align:right"><div class="tag">'+(remaining>=0?'Te quedan':'Te has pasado')+'</div><div class="big">'+fmt(Math.abs(remaining))+'</div><div class="small muted">kcal</div></div></div><div class="bar"><span style="width:'+Math.min(100,n/goal*100)+'%"></span></div><div class="progress">'+fmt(n/goal*100)+'% del objetivo diario</div></section><div class="grid">'+[['Proteínas',m[0],'g'],['Hidratos',m[1],'g'],['Grasas',m[2],'g'],['Fibra',m[3],'g']].map(x=>'<div class="metric"><span class="muted small">'+x[0]+'</span><b>'+fmt(x[1])+' <small style="font-size:12px"> '+x[2]+'</small></b></div>').join('')+'</div><section class="card"><h2>Lo que has registrado hoy</h2>'+ (dayEntries(d).length?dayEntries(d).map(x=>'<div class="item row between"><div><b>'+esc(x.name)+'</b><div class="small muted">'+esc(x.meal)+'</div></div><b>'+fmt(x.kcal)+' kcal</b></div>').join(''):'<p class="muted">Todavía no has registrado comidas hoy.</p>')+'<button onclick="go(\'Comidas\')">Añadir comida</button></section><section class="card"><h2>Últimos registros</h2>'+state().history.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<div class="item row between"><div><b>'+x.date+'</b><div class="small muted">'+(x.partial?'Registro parcial: macros no disponibles':'Historial')+'</div></div><b>'+x.total+' kcal</b></div>').join('')+'</section>'}
function meals(){return '<section class="card"><h2>Registrar alimento</h2><div class="row"><div class="field"><label>Fecha</label><input type="date" id="md" value="'+today()+'"></div><div class="field"><label>Comida</label><select id="mt"><option>Desayuno</option><option>Media mañana</option><option>Comida</option><option>Merienda</option><option>Cena</option><option>Otros</option></select></div></div><div id="mealrows"></div><div class="actions"><button class="secondary" onclick="addMealRow()">+ Añadir alimento</button><button onclick="saveMeal()">Guardar comida</button></div><p class="small muted">Los macros se calculan con los valores por 100 g de tu biblioteca.</p></section><section class="card"><h2>Registros de hoy</h2>'+dayEntries(today()).map(x=>'<div class="item"><div class="row between"><b>'+esc(x.name)+'</b><b>'+fmt(x.kcal)+' kcal</b></div><div class="small muted">'+esc(x.meal)+' · P '+fmt(x.p)+' g · HC '+fmt(x.c)+' g · G '+fmt(x.g)+' g</div></div>').join('')+'</section>'}
function addMealRow(){let box=document.getElementById('mealrows');let opts=state().foods.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('');let el=document.createElement('div');el.className='foodline';el.style.margin='9px 0';el.innerHTML='<div class="field"><label>Alimento</label><select class="mf">'+opts+'</select></div><div class="field"><label>Gramos</label><input class="mg" type="number" min="0" placeholder="g"></div><div class="field"><label>&nbsp;</label><button class="danger" onclick="this.parentElement.parentElement.remove()">×</button></div>';box.appendChild(el)}
function saveMeal(){let rows=[...document.querySelectorAll('#mealrows .foodline')],d=document.getElementById('md').value,t=document.getElementById('mt').value;if(!rows.length||!d){alert('Añade al menos un alimento y una fecha.');return}let added=[];for(let r of rows){let f=state().foods.find(x=>x.id===r.querySelector('.mf').value),g=Number(r.querySelector('.mg').value);if(!f||g<=0){alert('Revisa los gramos de cada alimento.');return}let q=g/100;added.push({date:d,meal:t,name:f.name+' · '+g+' g',grams:g,kcal:f.kcal*q,p:f.p*q,c:f.c*q,g:f.g*q,fiber:f.fiber*q})}state().meals.push(...added);if(confirm('¿Quieres descontar también estos alimentos de la despensa?')){for(let x of added){let p=state().pantry.find(y=>y.foodId===state().foods.find(f=>f.name===x.name.split(' · ')[0])?.id);if(p)p.qty=Math.max(0,p.qty-x.grams)}}save();render()}
function foods(){return '<section class="card"><h2>Biblioteca de alimentos</h2><p class="small muted">Valores orientativos por 100 g. Ajusta siempre según la etiqueta de tu producto.</p><div class="field"><label>Buscar</label><input id="fs" placeholder="Buscar alimento..." oninput="filterFoods()"></div><div id="foodlist">'+foodRows()+'</div></section><section class="card"><h2>Añadir alimento</h2>'+foodForm()+'</section>'}
function foodRows(){return state().foods.map(f=>'<div class="item" data-name="'+esc(f.name.toLowerCase())+'"><div class="row between"><b>'+esc(f.name)+'</b><b>'+f.kcal+' kcal</b></div><div class="small muted">P '+f.p+' · HC '+f.c+' · G '+f.g+' · Fibra '+f.fiber+' g / 100 g</div><div class="actions" style="margin-top:7px"><button class="secondary" onclick="editFood(\''+f.id+'\')">Editar</button><button class="danger" onclick="deleteFood(\''+f.id+'\')">Borrar</button></div></div>').join('')}
function filterFoods(){let v=document.getElementById('fs').value.toLowerCase();document.querySelectorAll('#foodlist [data-name]').forEach(x=>x.classList.toggle('hidden',!x.dataset.name.includes(v)))}
function foodForm(f){return '<div class="field"><label>Nombre</label><input id="fn" value="'+esc(f?.name||'')+'"></div><div class="grid">'+[['fk','Kcal'],['fp','Proteínas'],['fc','Hidratos'],['fg','Grasas'],['ff','Fibra']].map(x=>'<div class="field"><label>'+x[1]+' / 100 g</label><input id="'+x[0]+'" type="number" step=".1" value="'+(f?.[({fk:'kcal',fp:'p',fc:'c',fg:'g',ff:'fiber'})[x[0]]]??'')+'"></div>').join('')+'</div><button onclick="saveFood(\''+(f?.id||'')+'\')">Guardar alimento</button>'}
function editFood(id){let f=state().foods.find(x=>x.id===id);document.getElementById('foodedit')?.remove();let d=document.createElement('section');d.className='card';d.id='foodedit';d.innerHTML='<h2>Editar alimento</h2>'+foodForm(f);document.getElementById('app').appendChild(d);d.scrollIntoView({behavior:'smooth'})}
function saveFood(id){let v={name:document.getElementById('fn').value.trim(),kcal:Number(document.getElementById('fk').value),p:Number(document.getElementById('fp').value),c:Number(document.getElementById('fc').value),g:Number(document.getElementById('fg').value),fiber:Number(document.getElementById('ff').value)};if(!v.name||Object.values(v).some(x=>x===''||Number.isNaN(x))){alert('Completa todos los campos.');return}if(id)Object.assign(state().foods.find(x=>x.id===id),v);else state().foods.push({...v,id:'f'+Date.now()});save();render()}
function deleteFood(id){if(confirm('¿Borrar este alimento de la biblioteca?')){state().foods=state().foods.filter(x=>x.id!==id);save();render()}}
function pantry(){return '<section class="card"><h2>Mi despensa y nevera</h2><p class="muted small">Añade cantidades actuales y mínimos. Los productos por debajo del mínimo aparecerán en la lista de compra.</p>'+state().pantry.map(p=>{let f=state().foods.find(x=>x.id===p.foodId);return '<div class="item row between"><div><b>'+esc(f?.name||'Alimento')+'</b><div class="small muted">Actual: '+p.qty+' g · Mínimo: '+p.min+' g</div>'+(p.qty<p.min?'<span class="tag">Reponer</span>':'')+'</div><div class="actions"><button class="secondary" onclick="adjustPantry(\''+p.id+'\')">Editar</button><button class="danger" onclick="removePantry(\''+p.id+'\')">×</button></div></div>'}).join('')+'<h3 style="margin-top:14px">Añadir a despensa</h3><div class="field"><label>Alimento</label><select id="pf">'+state().foods.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('')+'</select></div><div class="row"><div class="field"><label>Cantidad actual (g)</label><input id="pq" type="number" value="0"></div><div class="field"><label>Mínimo (g)</label><input id="pm" type="number" value="200"></div></div><button onclick="addPantry()">Añadir</button></section><section class="card"><h2>Lista de la compra</h2>'+ (state().pantry.filter(p=>p.qty<p.min).map(p=>'<div class="item">□ '+esc(state().foods.find(f=>f.id===p.foodId)?.name||'')+' — faltan '+Math.max(0,p.min-p.qty)+' g</div>').join('')||'<p class="muted">No hay productos por debajo del mínimo.</p>')+'</section>'}
function addPantry(){let id=document.getElementById('pf').value;if(state().pantry.some(x=>x.foodId===id)){alert('Ese alimento ya está en la despensa. Edítalo en la lista.');return}state().pantry.push({id:'p'+Date.now(),foodId:id,qty:Number(document.getElementById('pq').value),min:Number(document.getElementById('pm').value)});save();render()}
function adjustPantry(id){let p=state().pantry.find(x=>x.id===id),q=prompt('Cantidad actual en gramos',p.qty);if(q===null)return;let m=prompt('Cantidad mínima en gramos',p.min);if(m===null)return;p.qty=Math.max(0,Number(q)||0);p.min=Math.max(0,Number(m)||0);save();render()}
function removePantry(id){if(confirm('¿Quitar de la despensa?')){state().pantry=state().pantry.filter(x=>x.id!==id);save();render()}}
function recipes(){let p=state().pantry.filter(x=>x.qty>0);let choices=[{name:'Pollo con pimiento y cebolla',needs:['Pechuga de pollo','Pimiento rojo','Cebolla'],desc:'Saltea la cebolla y el pimiento con un poco de aceite. Añade el pollo en tiras y cocina hasta que esté hecho.'},{name:'Tortilla con tomate',needs:['Huevo','Tomate cherry'],desc:'Bate los huevos, cuaja la tortilla a fuego medio y acompaña con tomates cherry.'},{name:'Avena con plátano y yogur',needs:['Avena','Plátano','Yogur natural'],desc:'Mezcla la avena con yogur y añade plátano en rodajas.'},{name:'Pasta con tomate y pollo',needs:['Pasta seca','Tomate frito','Pechuga de pollo'],desc:'Cuece la pasta. Cocina el pollo en dados y mezcla con tomate frito.'}];return '<section class="card"><h2>Ideas según tu despensa</h2><p class="small muted">Sugerencias sin pescado, marisco ni alimentos del mar.</p>'+choices.map(r=>{let missing=r.needs.filter(n=>!p.some(x=>state().foods.find(f=>f.id===x.foodId)?.name===n));return '<div class="item"><div class="row between"><b>'+r.name+'</b><span class="tag">'+(missing.length?'Faltan '+missing.length:'Tienes todo')+'</span></div><p class="small">'+r.desc+'</p><div class="small muted">Ingredientes: '+r.needs.join(', ')+'</div></div>'}).join('')+'</section>'}
function data(){return '<section class="card"><h2>Objetivo diario</h2><div class="field"><label>Calorías objetivo</label><input id="goal" type="number" value="'+state().goal+'"></div><button onclick="setGoal()">Guardar objetivo</button></section><section class="card"><h2>Perfiles</h2><div class="field"><label>Perfil activo</label><select id="profile" onchange="switchProfile(this.value)">'+Object.keys(db.profiles).map(x=>'<option '+(x===db.active?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div><div class="row"><div class="field"><label>Nuevo perfil</label><input id="newprofile" placeholder="Nombre del perfil"></div><button onclick="newProfile()">Crear desde cero</button></div></section><section class="card"><h2>Copias de seguridad</h2><p class="small muted">Exporta todos los perfiles, biblioteca, historial y despensa en un archivo JSON.</p><div class="actions"><button onclick="exportData()">Exportar copia JSON</button><button class="secondary" onclick="exportCSV()">Exportar historial CSV</button></div><div class="field"><label>Importar copia JSON</label><input id="importfile" type="file" accept="application/json"></div><button class="secondary" onclick="importData()">Importar copia</button></section><section class="card"><h2>Gestión de datos</h2><div class="actions"><button class="secondary" onclick="resetHistory()">Reiniciar comidas registradas</button><button class="danger" onclick="deleteProfile()">Borrar perfil actual</button></div></section><div class="notice">Los datos se guardan en este navegador y dispositivo. Para conservarlos, exporta copias JSON periódicamente. La aplicación todavía no sincroniza automáticamente entre dispositivos.</div>'}
function setGoal(){let n=Number(document.getElementById('goal').value);if(n<=0){alert('Introduce un objetivo válido.');return}state().goal=n;save();render()}
function switchProfile(n){db.active=n;save();render()}
function newProfile(){let n=document.getElementById('newprofile').value.trim();if(!n||db.profiles[n]){alert('Escribe un nombre nuevo.');return}db.profiles[n]={...structuredClone(seed),foods:structuredClone(initialFoods),history:[],meals:[],pantry:[]};db.active=n;save();render()}
function deleteProfile(){if(Object.keys(db.profiles).length===1){alert('No puedes borrar el único perfil.');return}if(confirm('¿Borrar por completo el perfil '+db.active+'? Esta acción no se puede deshacer.')){delete db.profiles[db.active];db.active=Object.keys(db.profiles)[0];save();render()}}
function resetHistory(){if(confirm('¿Borrar todas las comidas registradas del perfil? La biblioteca y la despensa se conservarán.')){state().meals=[];state().history=[];save();render()}}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='entiende-tu-cuerpo-copia-'+today()+'.json';a.click();URL.revokeObjectURL(u)}
function importData(){let f=document.getElementById('importfile').files[0];if(!f){alert('Selecciona un archivo JSON.');return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.profiles||!x.active||!x.profiles[x.active])throw Error();if(confirm('La importación sustituirá los datos actuales de esta aplicación. ¿Continuar?')){db=x;save();render()}}catch(e){alert('El archivo no parece una copia válida de Entiende tu cuerpo.')}};r.readAsText(f)}
function exportCSV(){let rows=[['Fecha','Comida','Alimento','Kcal','Proteínas','Hidratos','Grasas','Fibra']];for(let x of state().meals)rows.push([x.date,x.meal,x.name,x.kcal,x.p??'',x.c??'',x.g??'',x.fiber??'']);for(let h of state().history)for(let x of h.entries)rows.push([h.date,x.meal,x.name,x.kcal,x.p??'',x.c??'',x.g??'',x.fiber??'']);let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'),b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='historial-alimentacion.csv';a.click();URL.revokeObjectURL(u)}
// Los registros históricos parciales se conservan sin recalcular sus calorías ni inventar macros.
if(!localStorage.getItem(KEY)){save()}
render();
</script></body></html>
